<dialog id="expense-dialog">
  <form method="post" action="{% url 'expense_add' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="button-secondary">Save</button>
    <button type="button" class="button-secondary" onclick="this.closest('dialog').close()">Cancel</button>
  </form>
</dialog>
